# ---------------------------------------------------------------------
# Worker "memoria": guarda los LoRA y todo lo que se genera con ellos.
#
# Es un Worker APARTE del bot de Invictus (carpeta worker/). No comparten
# nada: otra base D1, otro bucket, otra URL.
#
# Antes de desplegar, una sola vez:
#   npx wrangler d1 create memoria-db
#   (pega el database_id que imprime en database_id, abajo)
#   npx wrangler d1 migrations apply memoria-db --remote
#   npx wrangler r2 bucket create memoria-archivos
#   npx wrangler secret put MEMORIA_TOKEN   (una clave larga inventada por ti)
#   npx wrangler secret put FAL_KEY          (solo si GENERADOR = "fal")
# ---------------------------------------------------------------------

name = "memoria"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Tablas: loras y generaciones (ver migrations/0001_inicial.sql)
[[d1_databases]]
binding = "DB"
database_name = "memoria-db"
database_id = "PENDIENTE_pega_aqui_el_database_id_que_imprime_wrangler_d1_create"

# Archivos: las imagenes generadas (imagenes/...) y, solo con fal, los
# .safetensors (loras/...). El bucket es PRIVADO: fal descarga el LoRA por
# un enlace firmado que caduca, nunca por una URL publica.
[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "memoria-archivos"

[vars]
# Quien genera las imagenes:
#   "local" -> tu SwarmUI, con los modelos y LoRA que ya tienes. Hace falta
#              dejar corriendo puente/puente_swarm.py (ver README).
#   "fal"   -> GPU en la nube de fal.ai (pide FAL_KEY y subir los LoRA).
GENERADOR = "local"

# --- Solo para GENERADOR = "fal" ---------------------------------------
# Modelo de fal que corre los LoRA. flux-lora acepta varios LoRA a la vez.
FAL_MODELO = "fal-ai/flux-lora"
# Cuantos minutos vale el enlace firmado con el que fal descarga un LoRA.
ENLACE_MINUTOS = "30"
