name = "panel-central"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ── EL PANEL CENTRAL ──────────────────────────────────────────────────
# Este Worker NO atiende clientes: solo mira todas las tiendas y las junta
# en un solo sitio (mensajes en vivo, alertas, métricas, ganadores, gastos,
# errores y sus bases de datos). Cada tienda sigue siendo su propio Worker.
#
# Va en el plan pagado de Workers (US$5/mes, 10 millones de peticiones al
# mes): le sobra. Las tiendas pueden seguir en el gratis.

# --- Su propia base (alertas, estado de las tiendas, intentos de entrar) ---
# Una vez, antes del primer despliegue:
#   npx.cmd wrangler d1 create panel-central-db
#   (imprime un database_id: pégalo abajo, en lugar de PEGA_AQUI_EL_ID)
# Las tablas se crean solas: no hay migraciones que correr.
[[d1_databases]]
binding = "DB"
database_name = "panel-central-db"
database_id = "PEGA_AQUI_EL_ID"

# --- Cada 2 minutos: ¿siguen vivas las tiendas? -------------------------
# Si una deja de responder, salta una alerta 🚨; cuando vuelve, otra ✅.
[triggers]
crons = ["*/2 * * * *"]

[vars]
# El nombre de la empresa: sale arriba en el panel y en la pestaña.
PANEL_NOMBRE = "ALPHA IA"

# Las tiendas. Para añadir una: su id (minúsculas, sin espacios), su nombre
# y la dirección de su Worker. Cada una necesita además su clave (abajo).
# El Emperador no está porque está congelado; cuando se conecte, se añade:
#   {"id":"emperador","nombre":"El Emperador","url":"https://emperador-bot.elemperadorca1992.workers.dev"}
TIENDAS = '''
[
  {"id": "invictus", "nombre": "Invictus", "url": "https://invictus-bot.invictusshoes.workers.dev"},
  {"id": "epicell",  "nombre": "EPICELL",  "url": "https://bot-telefonos.arizatecnologia.workers.dev"}
]
'''

# --- SECRETOS (NUNCA aquí: npx.cmd wrangler secret put NOMBRE) ---------
#   PANEL_CLAVE      la clave para entrar al panel (12 letras o más)
#   CLAVE_INVICTUS   la misma que Invictus tiene en su PANEL_API_CLAVE
#   CLAVE_EPICELL    la misma que EPICELL tiene en su PANEL_API_CLAVE
# Cada tienda con una clave DISTINTA: por la clave se sabe de qué tienda
# viene cada alerta.
