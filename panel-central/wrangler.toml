name = "panel"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ── EL PANEL CENTRAL DE ALPHA IA ──────────────────────────────────────
# Este Worker NO atiende clientes: solo mira todas las tiendas y las junta
# en un solo sitio (mensajes en vivo, alertas, métricas, ganadores, gastos,
# errores y sus bases de datos). Cada tienda sigue siendo su propio Worker.
#
# VA EN LA CUENTA DE CLOUDFLARE DE ALPHA IA, no en la de ninguna tienda
# (decidido el 2-oct-2026). Dos motivos:
#   · Cloudflare no deja que un Worker llame por workers.dev a otro de la
#     MISMA cuenta (error 1042): en la cuenta de Invictus no podía leerlo.
#   · La dirección queda a nombre de la empresa:
#     https://panel.<subdominio de ALPHA IA>.workers.dev
#
# El plan gratis le alcanza con pocas tiendas (100.000 peticiones al día).
#
# account_id: el de la cuenta de ALPHA IA (sale en el panel de Cloudflare,
# a la derecha de "Workers & Pages"). No es secreto. Con él, wrangler
# despliega SIEMPRE aquí, aunque tu usuario tenga acceso a varias cuentas:
# así es imposible subir el panel a la cuenta de Invictus por error.
account_id = "9494b3db15f8cd2c4d50d14622ee26e8"

# --- Su propia base (alertas, estado de las tiendas, intentos de entrar) ---
# Ya está creada (11-oct-2026: este es el id de la que usa el panel en
# Cloudflare). No es secreto: sin la sesión de la cuenta no sirve de nada.
# Si alguna vez hiciera falta otra: npx.cmd wrangler d1 create panel-central-db
# Las tablas se crean solas: no hay migraciones que correr.
[[d1_databases]]
binding = "DB"
database_name = "panel-central-db"
database_id = "a6dca4cc-2bfa-4cc2-85da-af7561e407ed"

# --- Cada 2 minutos: ¿siguen vivas las tiendas? -------------------------
# Si una deja de responder, salta una alerta 🚨; cuando vuelve, otra ✅.
[triggers]
crons = ["*/2 * * * *"]

[vars]
# El nombre de la empresa: sale arriba en el panel y en la pestaña.
PANEL_NOMBRE = "ALPHA IA"

# Las tiendas. Para añadir una: su id (minúsculas, sin espacios), su nombre
# y la dirección de su Worker. Cada una necesita además su clave (abajo).
TIENDAS = '''
[
  {"id": "invictus", "nombre": "Invictus", "url": "https://invictus-bot.invictusshoes.workers.dev"},
  {"id": "epicell",  "nombre": "EPICCELL",  "url": "https://bot-telefonos.arizatecnologia.workers.dev"},
  {"id": "emperador", "nombre": "El Emperador", "url": "https://emperador-bot.elemperadorca1992.workers.dev"}
]
'''

# --- SECRETOS (NUNCA aquí: npx.cmd wrangler secret put NOMBRE) ---------
#   PANEL_CLAVE      la clave para entrar al panel (12 letras o más)
#   CLAVE_INVICTUS   la misma que Invictus tiene en su PANEL_API_CLAVE
#   CLAVE_EPICELL    la misma que EPICCELL tiene en su PANEL_API_CLAVE
#   CLAVE_EMPERADOR  la misma que El Emperador tiene en su PANEL_API_CLAVE
# Cada tienda con una clave DISTINTA: por la clave se sabe de qué tienda
# viene cada alerta.
